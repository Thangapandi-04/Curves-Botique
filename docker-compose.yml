services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: curve_root_change_me
      MYSQL_DATABASE: curve
      MYSQL_USER: curve_app
      MYSQL_PASSWORD: curve_app_change_me
    ports:
      - "3306:3306"
    volumes:
      - curve_mysql:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
volumes:
  curve_mysql:
